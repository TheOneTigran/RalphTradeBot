services:
  ralph-live-scanner:
    build: .
    container_name: ralph-live-scanner
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./results:/app/results
      - ./data:/app/data
      - ./vision_cache.json:/app/vision_cache.json
      - ./seen_signals.json:/app/seen_signals.json
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
