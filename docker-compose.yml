services:
  ralph-live-scanner:
    image: ralphtradebot-ralph-live-scanner:latest
    container_name: ralph-live-scanner
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/app
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
